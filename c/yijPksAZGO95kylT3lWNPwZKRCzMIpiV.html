function curProject(){
  var p=data.projects.filter(function(x){return x.id===activeProj})[0];
  if(!p&&data.projects.length){p=data.projects[0];activeProj=p.id}
  return p||null;
}
function project(id){return data.projects.filter(function(x){return x.id===id})[0]||null}

/* ---------- GitHub API ---------- */
var API="https://api.github.com";
async function gh(method,path,body){
  var headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+cfg.token};
  if(body)headers["Content-Type"]="application/json";
  var r;
  try{
    r=await fetch(API+path,{method:method,cache:"no-store",headers:headers,body:body?JSON.stringify(body):undefined});
  }catch(e){
    var err=new Error("Нет связи с GitHub");err.status=0;throw err;
  }
  var j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){
    var er=new Error((j&&j.message)||("Ошибка "+r.status));er.status=r.status;throw er;
  }
  return j;
}
function encPath(p){return p.split("/").map(encodeURIComponent).join("/")}
async function readFile(repo,path){
  try{
    var j=await gh("GET","/repos/"+cfg.owner+"/"+repo+"/contents/"+encPath(path));
    return {text:fromB64(j.content||""),sha:j.sha};
  }catch(e){
    if(e.status===404)return null;
    throw e;
  }
}
async function writeFile(repo,path,text,sha,msg){
  var body={message:msg||"Обновление",content:toB64(text)};
  if(sha)body.sha=sha;
  return gh("PUT","/repos/"+cfg.owner+"/"+repo+"/contents/"+encPath(path),body);
}
async function deleteFile(repo,path,msg){
  var f=await readFile(repo,path);
  if(!f)return;
  await gh("DELETE","/repos/"+cfg.owner+"/"+repo+"/contents/"+encPath(path),{message:msg||"Удаление",sha:f.sha});
}

/* ---------- status / toast ---------- */
var toastTimer=null;
function toast(msg){
  var t=$("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove("show")},3400);
}
function setSync(kind,msg){
  var s=$("sync");
  s.className="sync"+(kind==="err"?" err":"");
  s.textContent=msg||"";
}

/* ---------- data layer ---------- */
function emptyData(){return {v:1,projects:[{id:uid(),name:"Основной проект",token:null}],entries:[]}}
function cacheLocal(){lsSet(LS_DATA,JSON.stringify(data))}
function mutate(fn){
  fn(data);
  pending.push(fn);
  cacheLocal();
  render();renderList();
  scheduleSave();
}
function scheduleSave(){
  setSync("ok","Сохраняю…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,500);
}
async function flush(){
  if(saving||!pending.length)return;
  saving=true;
  var batch=pending.length;
  var failed=null;
  try{
    for(var attempt=0;attempt<4;attempt++){
      try{
        var res=await writeFile(cfg.dataRepo,"data.json",JSON.stringify(data),dataSha,"Обновление календаря");
        dataSha=res.content.sha;
        pending.splice(0,batch);
        failed=null;
        break;
      }catch(e){
        if(e.status===409||e.status===422){
          var remote=await readFile(cfg.dataRepo,"data.json");
          if(remote){data=JSON.parse(remote.text);dataSha=remote.sha}
          else{dataSha=null}
          pending.forEach(function(fn){fn(data)});
          cacheLocal();
          failed=e;
          continue;
        }
        throw e;
      }
    }
    if(failed)throw failed;
  }catch(e){
    saving=false;
    handleErr(e,true);
    return;
  }
  saving=false;
  if(pending.length){scheduleSave()}
  else{setSync("ok","Сохранено");render();renderList();renderMgr()}
}
function handleErr(e,willRetry){
  if(e&&(e.status===401||e.status===403)){
    setSync("err","Ключ не подходит или закончился");
    toast("GitHub не принял ключ. Открой «Проекты и ссылки» → «Отключить это устройство» и подключись заново.");
    return;
  }
  if(e&&e.status===0){
    setSync("err",pending.length?"Нет связи, повторю позже":"Нет связи");
  }else{
    setSync("err","Ошибка: "+((e&&e.message)||"неизвестная"));
  }
  if(willRetry&&pending.length){
    clearTimeout(retryTimer);
    retryTimer=setTimeout(function(){flush()},15000);
  }
}
async function loadRemote(){
  var f=await readFile(cfg.dataRepo,"data.json");
  if(!f){
    data=emptyData();
    var res=await writeFile(cfg.dataRepo,"data.json",JSON.stringify(data),null,"Создание календаря");
    dataSha=res.content.sha;
  }else{
    data=JSON.parse(f.text);dataSha=f.sha;
  }
  if(!data.projects||!data.projects.length)data.projects=[{id:uid(),name:"Основной проект",token:null}];
  if(!data.entries)data.entries=[];
  cacheLocal();
}
var lastCheck=0;
async function refreshIfChanged(){
  if(CLIENT||!cfg||saving||pending.length)return;
  if(Date.now()-lastCheck<30000)return;
  lastCheck=Date.now();
  try{
    var f=await readFile(cfg.dataRepo,"data.json");
    if(f&&f.sha!==dataSha&&!pending.length){
      data=JSON.parse(f.text);dataSha=f.sha;cacheLocal();
      if(editId&&!data.entries.some(function(e){return e.id===editId}))editId=null;
      render();renderList();renderMgr();
      setSync("ok","Обновлено");
    }
  }catch(e){}
}

/* ---------- grid ---------- */
function byTime(a,b){
  var ta=a.time||"99:99",tb=b.time||"99:99";
  if(ta!==tb)return ta<tb?-1:1;
  return (a.createdAt||0)-(b.createdAt||0);
}
function entriesFor(dateKey,applyFilter){
  var out=[];
  data.entries.forEach(function(e){
    if(e.project!==activeProj||e.date!==dateKey)return;
    if(applyFilter&&!filter.has(e.type))return;
    out.push(e);
  });
  return out.sort(byTime);
}
function monthGrid(){
  var first=new Date(view);
  var offset=(first.getDay()+6)%7;
  var daysInMonth=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  var total=Math.ceil((offset+daysInMonth)/7)*7;
  var start=new Date(first);start.setDate(1-offset);
  return {start:start,total:total};
}
function render(){
  curProject();
  $("title").textContent=MONTHS[view.getMonth()]+" "+view.getFullYear();
  if(!CLIENT){
    $("projSel").innerHTML=data.projects.map(function(p){
      return '<option value="'+esc(p.id)+'"'+(p.id===activeProj?" selected":"")+'>'+esc(p.name)+'</option>';
    }).join("");
  }
  var g=monthGrid();
  var todayKey=dkey(new Date());
  var grouped={};
  data.entries.forEach(function(e){
    if(e.project!==activeProj||!filter.has(e.type))return;
    (grouped[e.date]=grouped[e.date]||[]).push(e);
  });
  var html="";
  for(var i=0;i<g.total;i++){
    var d=new Date(g.start);d.setDate(g.start.getDate()+i);
    var k=dkey(d);
    var off=d.getMonth()!==view.getMonth();
    var list=(grouped[k]||[]).sort(byTime);
    var main=list[0];
    var num=d.getDate()===1?d.getDate()+" "+MONTHS_GEN[d.getMonth()].slice(0,3):d.getDate();
    var inner='<span class="num">'+num+'</span>';
    var cls="cell"+(off?" off":"")+(k===todayKey?" today":"")+(k===sel?" sel":"");
    var style="";
    if(main){
      var t=typeOf(main.type),s=statusOf(main.status);
      cls+=" full";
      style=' style="--c:var(--c-'+esc(t.id)+')"';
      inner+='<button class="block st-'+esc(s.id)+'" draggable="'+(readOnly?"false":"true")+'" data-id="'+esc(main.id)+'" title="'+esc(t.name+": "+(main.title||""))+'">'
        +'<span class="bt">'+esc(t.name)+'<span class="bs">'+(main.time?esc(main.time)+" ":"")+s.g+'</span></span>'
        +(main.title?'<span class="bh">'+esc(main.title)+'</span>':"")
        +'</button>';
      if(list.length>1)inner+='<button class="more" data-date="'+k+'" title="Ещё записей в этот день">+'+(list.length-1)+'</button>';
    }
    html+='<div class="'+cls+'" data-date="'+k+'"'+style+'>'+inner+'</div>';
  }
  $("days").innerHTML=html;
}
function renderLegend(){
  $("legend").innerHTML=TYPES.map(function(t){
    return '<button class="tf" data-type="'+t.id+'" aria-pressed="'+filter.has(t.id)+'" style="--c:var(--c-'+t.id+')"><i></i>'+esc(t.name)+'</button>';
  }).join("");
}

function fillForm(){

  $("fTitle").value=draft.title;
  $("fDate").value=draft.date;
  $("fTime").value=draft.time;
  $("fStatus").value=draft.status;
  $("fText").value=draft.text;

}
function updateFormMode(){
  $("pFormTitle").textContent=editId?"Редактирование":"Новая запись";
  $("fCancel").hidden=!editId;
  $("fDel").hidden=!editId;
  delArmed=false;
  $("fDel").textContent="Удалить";
  $("fDel").classList.remove("armed");
}
function renderList(){
  if(!sel)return;
  $("pTitle").textContent=fmtLong(sel);
  var list=entriesFor(sel,false);
  if(!list.length){
    $("pList").innerHTML='<div class="empty">На этот день записей нет.'+(readOnly?"":" Добавьте первую ниже.")+'</div>';
    return;
  }
  $("pList").innerHTML=list.map(function(e){
    var t=typeOf(e.type),s=statusOf(e.status);
    var pre=readOnly?"":(e.text||"").split("\n")[0];
    return '<button class="item'+(e.id===editId?" cur":"")+'" data-id="'+esc(e.id)+'" style="--c:var(--c-'+t.id+')">'
      +'<div class="top"><span class="g">'+s.g+'</span><span>'+esc(t.name)+(e.time?" · "+esc(e.time):"")+" · "+esc(s.name)+'</span></div>'
      +'<div class="ttl">'+esc(e.title||"Без названия")+'</div>'
      +(pre?'<div class="pre">'+esc(pre)+'</div>':"")
      +'</button>';
  }).join("");
}
function blankDraft(date){return {type:lastType,status:"idea",title:"",time:"",text:"",date:date}}
function closeAll(){
  $("panel").classList.remove("open");$("pm").classList.remove("open");$("scrim").classList.remove("open");
  $("panel").setAttribute("aria-hidden","true");$("pm").setAttribute("aria-hidden","true");
  sel=null;editId=null;
  render();
}
function openPanel(date,id){
  $("pm").classList.remove("open");
  sel=date;editId=id||null;
  var e=id?data.entries.filter(function(x){return x.id===id})[0]:null;
  if(id&&!e)editId=null;
  draft=e?{type:e.type,status:e.status,title:e.title||"",time:e.time||"",text:e.text||"",date:e.date}:blankDraft(date);
  fillForm();renderList();
  $("panel").classList.toggle("ro",readOnly);
  $("panel").classList.add("open");$("scrim").classList.add("open");
  $("panel").setAttribute("aria-hidden","false");
  render();
  if(!editId&&!readOnly&&!window.matchMedia("(max-width:700px)").matches){
    setTimeout(function(){$("fTitle").focus()},60);
  }
}
function save(){
  if(readOnly)return;
  if(!draft.title.trim()&&!draft.text.trim()){
    toast("Добавьте название или заметку");$("fTitle").focus();return;
  }
  var base=editId?data.entries.filter(function(x){return x.id===editId})[0]:null;
  var entry={
    id:editId||uid(),
    project:(base&&base.project)||activeProj,
    date:draft.date||sel,
    type:draft.type,
    status:draft.status,
    title:draft.title.trim(),
    time:draft.time,
    text:draft.text,
    createdAt:(base&&base.createdAt)||Date.now()
  };
  lastType=entry.type;
  mutate(function(d){
    var i=d.entries.findIndex(function(x){return x.id===entry.id});
    if(i>=0)d.entries[i]=entry;else d.entries.push(entry);
  });
  var moved=entry.date!==sel;
  sel=entry.date;
  if(moved){var dd=parseKey(entry.date);view=new Date(dd.getFullYear(),dd.getMonth(),1)}
  editId=null;
  draft=blankDraft(sel);
  fillForm();renderList();render();
  toast("Сохранено");
}
function del(){
  if(!editId||readOnly)return;
  if(!delArmed){
    delArmed=true;
    $("fDel").textContent="Точно удалить?";
    $("fDel").classList.add("armed");
    return;
  }
  var id=editId;
  editId=null;
  draft=blankDraft(sel);
  mutate(function(d){d.entries=d.entries.filter(function(x){return x.id!==id})});
  fillForm();
  toast("Удалено");
}

/* ---------- client pages ---------- */
function siteBase(){
  var p=location.pathname;
  return location.origin+p.slice(0,p.lastIndexOf("/")+1);
}
function pageSrcUrl(){return location.origin+location.pathname}
function clientEntries(pid){
  return data.entries.filter(function(e){return e.project===pid}).map(function(e){
    return {id:e.id,date:e.date,type:e.type,status:e.status,title:e.title||"",time:e.time||""};
  }).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:byTime(a,b)});
}
function clientSig(pid){
  var p=project(pid);
  return djb(JSON.stringify([p?p.name:"",clientEntries(pid)]));
}
function clientUrl(token){return siteBase()+"c/"+token+".html"}
async function buildClientHtml(pid){
  var p=project(pid);
  var r=await fetch(pageSrcUrl(),{cache:"no-store"});
  var src=await r.text();
  var marker="<!--CLIENT"+"_DATA-->";
  if(src.indexOf(marker)<0)throw new Error("Не удалось прочитать страницу приложения");
  var payload={updated:Date.now(),project:{id:p.id,name:p.name},entries:clientEntries(pid)};
  var json=JSON.stringify(payload).replace(/</g,"\\u003c");
  var inject='<base href="../"><'+'script>window.__CLIENT__='+json+';<'+'/script>';
  var html=src.replace(marker,function(){return inject});
  html=html.replace(/<title>[^<]*<\/title>/,function(){return "<title>"+esc(p.name)+" — контент-план</title>"});
  return html;
}
async function publishClient(pid,reissue){
  if(busy[pid])return;
  busy[pid]=true;pjMsg[pid]="";renderMgr();
  try{
    var p=project(pid);
    var oldToken=p.token;
    var token=(!oldToken||reissue)?newToken():oldToken;
    var html=await buildClientHtml(pid);
    var path="c/"+token+".html";
    var ex=await readFile(cfg.siteRepo,path);
    await writeFile(cfg.siteRepo,path,html,ex&&ex.sha,"Календарь для клиента");
    if(reissue&&oldToken){try{await deleteFile(cfg.siteRepo,"c/"+oldToken+".html","Старая ссылка отключена")}catch(e){}}
    var sig=clientSig(pid),now=Date.now();
    mutate(function(d){
      var q=d.projects.filter(function(x){return x.id===pid})[0];
      if(q){q.token=token;q.publishedAt=now;q.pubSig=sig}
    });
    pjMsg[pid]="Готово. Страница на GitHub обновится у клиента в течение минуты.";
  }catch(e){
    pjMsg[pid]="warn:"+((e&&e.status===404)?"Репозиторий сайта не найден или у ключа нет доступа к нему.":(e&&e.message)||"Не получилось");
  }
  busy[pid]=false;renderMgr();
}
async function unpublishClient(pid){
  if(busy[pid])return;
  busy[pid]=true;renderMgr();
  try{
    var p=project(pid);
    if(p&&p.token)await deleteFile(cfg.siteRepo,"c/"+p.token+".html","Ссылка отключена");
    mutate(function(d){
      var q=d.projects.filter(function(x){return x.id===pid})[0];
      if(q){q.token=null;q.publishedAt=null;q.pubSig=null}
    });
    pjMsg[pid]="Ссылка отключена.";
  }catch(e){
    pjMsg[pid]="warn:"+((e&&e.message)||"Не получилось");
  }
  busy[pid]=false;renderMgr();
}

        +'<button class="btn sm pj-new" data-id="'+esc(p.id)+'"'+(b?" disabled":"")+'>Новая ссылка</button>'
        +'<button class="btn sm danger pj-off" data-id="'+esc(p.id)+'"'+(b?" disabled":"")+'>Отключить</button>'
        +'</div>'
        +'<div class="hint'+(changed?" warn":"")+'">'+(changed?"В календаре есть изменения, которых клиент ещё не видит. Нажми «Обновить для клиента».":"Клиент видит актуальный план"+(p.publishedAt?" (обновлено "+fmtDT(p.publishedAt)+")":"")+".")+'</div>';
    }else{
      link='<div class="pj-btns"><button class="btn sm primary pj-pub" data-id="'+esc(p.id)+'"'+(b?" disabled":"")+'>'+(b?"Создаю…":"Создать ссылку для клиента")+'</button></div>'
        +'<div class="hint">Клиент увидит только форматы, названия, даты и статусы. Заметки в ссылку не попадают.</div>';
    }
    var m=pjMsg[p.id]||"";
    var msg=m?'<div class="hint'+(m.indexOf("warn:")===0?" warn":"")+'">'+esc(m.replace(/^warn:/,""))+'</div>':"";
    var delBtn=data.projects.length>1
      ?'<button class="btn sm danger pj-del" data-id="'+esc(p.id)+'">'+(armedDel[p.id]?"Точно удалить?":"Удалить")+'</button>':"";
    return '<div class="pj"><div class="pj-top"><input class="pj-name" data-id="'+esc(p.id)+'" value="'+esc(p.name)+'" aria-label="Название проекта">'+delBtn+'</div>'
      +'<div class="pj-link">'+link+msg+'</div></div>';
  }).join("");
  $("pmBody").innerHTML=html;
}
function openMgr(){
  $("panel").classList.remove("open");
  sel=null;
  renderMgr();
  $("pm").classList.add("open");$("scrim").classList.add("open");
  $("pm").setAttribute("aria-hidden","false");
}
function exportData(){
  var blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  var n=new Date();
  a.download="kalendar-backup-"+dkey(n)+".json";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- events ---------- */
$("prev").addEventListener("click",function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);render()});
$("next").addEventListener("click",function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);render()});
$("today").addEventListener("click",function(){var n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);render()});
$("print").addEventListener("click",doPrint);
$("mgr").addEventListener("click",openMgr);
$("projSel").addEventListener("change",function(){
  activeProj=this.value;lsSet(LS_PROJ,activeProj);render();
});

$("legend").addEventListener("click",function(ev){
  var b=ev.target.closest(".tf");if(!b)return;
  var id=b.dataset.type;
  if(filter.has(id))filter.delete(id);else filter.add(id);
  renderLegend();render();
});

$("days").addEventListener("click",function(ev){
  var more=ev.target.closest(".more");
  if(more){openPanel(more.dataset.date);return}
  var cell=ev.target.closest(".cell");
  if(cell)openPanel(cell.dataset.date);
});
$("days").addEventListener("dragstart",function(ev){
  var b=ev.target.closest(".block");if(!b||readOnly){ev.preventDefault();return}
  ev.dataTransfer.setData("text/plain",b.dataset.id);
  ev.dataTransfer.effectAllowed="move";
});
$("days").addEventListener("dragover",function(ev){
  var cell=ev.target.closest(".cell");if(!cell||readOnly)return;
  ev.preventDefault();
  Array.prototype.forEach.call(document.querySelectorAll(".cell.over"),function(c){if(c!==cell)c.classList.remove("over")});
  cell.classList.add("over");
});
$("days").addEventListener("dragleave",function(ev){
  var cell=ev.target.closest(".cell");
  if(cell&&!cell.contains(ev.relatedTarget))cell.classList.remove("over");
});
$("days").addEventListener("drop",function(ev){
  var cell=ev.target.closest(".cell");if(!cell||readOnly)return;
  ev.preventDefault();cell.classList.remove("over");
  var id=ev.dataTransfer.getData("text/plain");
  var e=data.entries.filter(function(x){return x.id===id})[0];
  var nd=cell.dataset.date;
  if(!e||e.date===nd)return;
  mutate(function(d){var x=d.entries.filter(function(y){return y.id===id})[0];if(x)x.date=nd});
});
document.addEventListener("dragend",function(){
  Array.prototype.forEach.call(document.querySelectorAll(".cell.over"),function(c){c.classList.remove("over")});
});

$("pList").addEventListener("click",function(ev){
  var it=ev.target.closest(".item");if(!it||readOnly)return;
  var e=data.entries.filter(function(x){return x.id===it.dataset.id})[0];if(!e)return;
  editId=e.id;
  draft={type:e.type,status:e.status,title:e.title||"",time:e.time||"",text:e.text||"",date:e.date};
  fillForm();renderList();
  if($("panel").scrollTo)$("panel").scrollTo({top:$("pForm").offsetTop-10,behavior:"smooth"});
});
$("pClose").addEventListener("click",closeAll);
$("pmClose").addEventListener("click",closeAll);
$("scrim").addEventListener("click",closeAll);
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&($("panel").classList.contains("open")||$("pm").classList.contains("open")))closeAll();
});

$("fTypes").addEventListener("click",function(ev){
  var b=ev.target.closest(".ty");if(!b)return;
  draft.type=b.dataset.type;renderTypes();
});
$("fTitle").addEventListener("input",function(){draft.title=this.value});
$("fDate").addEventListener("input",function(){draft.date=this.value});
$("fTime").addEventListener("input",function(){draft.time=this.value});
$("fStatus").addEventListener("change",function(){draft.status=this.value});
$("fText").addEventListener("input",function(){draft.text=this.value});
$("fSave").addEventListener("click",save);
$("fDel").addEventListener("click",del);
$("fCancel").addEventListener("click",function(){
  editId=null;draft=blankDraft(sel);fillForm();renderList();
});
$("fTitle").addEventListener("keydown",function(ev){if(ev.key==="Enter"){ev.preventDefault();save()}});

$("pmBody").addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  var id=b.dataset.id;
  if(b.classList.contains("pj-pub")){publishClient(id,false)}
  else if(b.classList.contains("pj-upd")){publishClient(id,false)}
  else if(b.classList.contains("pj-new")){publishClient(id,true)}
  else if(b.classList.contains("pj-off")){unpublishClient(id)}
  else if(b.classList.contains("pj-copy")){
    var p=project(id);if(!p||!p.token)return;
    var url=clientUrl(p.token);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){toast("Ссылка скопирована")},function(){toast("Не получилось скопировать. Выдели ссылку и скопируй вручную.")});
    }else{toast("Выдели ссылку и скопируй вручную.")}
  }
  else if(b.classList.contains("pj-del")){
    if(!armedDel[id]){armedDel[id]=true;renderMgr();return}
    armedDel[id]=false;
    var pr=project(id);
    (async function(){
      if(pr&&pr.token){try{await deleteFile(cfg.siteRepo,"c/"+pr.token+".html","Проект удалён")}catch(e){}}
      mutate(function(d){
        d.projects=d.projects.filter(function(x){return x.id!==id});
        d.entries=d.entries.filter(function(x){return x.project!==id});
        if(!d.projects.length)d.projects.push({id:uid(),name:"Основной проект",token:null});
      });
      if(activeProj===id){activeProj=data.projects[0].id;lsSet(LS_PROJ,activeProj)}
      render();renderMgr();
    })();
  }
});
$("pmBody").addEventListener("change",function(ev){
  var i=ev.target.closest(".pj-name");if(!i)return;
  var id=i.dataset.id,name=i.value.trim();
  if(!name){renderMgr();return}
  mutate(function(d){var q=d.projects.filter(function(x){return x.id===id})[0];if(q)q.name=name});
});
$("pmAdd").addEventListener("click",function(){
  var name=$("pmNew").value.trim();
  if(!name){toast("Введите название проекта");return}
  var id=uid();
  mutate(function(d){
    if(!d.projects.some(function(x){return x.id===id}))d.projects.push({id:id,name:name,token:null});
  });
  activeProj=id;lsSet(LS_PROJ,id);
  $("pmNew").value="";
  render();renderMgr();
  toast("Проект добавлен");
});
$("pmNew").addEventListener("keydown",function(ev){if(ev.key==="Enter"){ev.preventDefault();$("pmAdd").click()}});
$("pmExport").addEventListener("click",exportData);
$("pmDisc").addEventListener("click",function(){
  var b=$("pmDisc");
  if(!b.dataset.armed){
    b.dataset.armed="1";b.textContent="Точно отключить?";b.classList.add("armed");
    return;
  }
  lsDel(LS_CFG);lsDel(LS_DATA);lsDel(LS_PROJ);
  location.reload();
});

document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible")refreshIfChanged();
});
window.addEventListener("online",function(){if(pending.length)flush()});

/* ---------- setup ---------- */
function showSetupErr(msg){var e=$("sErr");e.textContent=msg;e.hidden=!msg}
async function connect(){
  var token=$("sToken").value.trim();
  var dataRepo=$("sData").value.trim()||"kalendar-data";
  var siteRepo=$("sSite").value.trim()||"kalendar";
  if(!token){showSetupErr("Вставь ключ доступа.");return}
  showSetupErr("");
  var b=$("sGo");b.disabled=true;b.textContent="Проверяю…";
  try{
    cfg={token:token,owner:"",dataRepo:dataRepo,siteRepo:siteRepo};
    var u=await gh("GET","/user");
    cfg.owner=u.login;
    var d;
    try{d=await gh("GET","/repos/"+cfg.owner+"/"+dataRepo)}
    catch(e){if(e.status===404)throw new Error("Не нашёл репозиторий «"+dataRepo+"». Проверь название и что ключ имеет к нему доступ.");throw e}
    if(d.private!==true)throw new Error("Репозиторий «"+dataRepo+"» открытый. Записи должны лежать в закрытом (Private).");
    if(d.permissions&&d.permissions.push===false)throw new Error("У ключа нет права записи в «"+dataRepo+"». Нужны права Contents: Read and write.");
    try{await gh("GET","/repos/"+cfg.owner+"/"+siteRepo)}
    catch(e){if(e.status===404)throw new Error("Не нашёл репозиторий сайта «"+siteRepo+"». Проверь название и что ключ имеет к нему доступ.");throw e}
    lsSet(LS_CFG,JSON.stringify(cfg));
    $("setup").hidden=true;
    await startAdmin(true);
  }catch(e){
    cfg=null;
    var m=e.message||"Не получилось подключиться";
    if(e.status===401)m="GitHub не принял ключ. Проверь, что скопировал его целиком.";
    showSetupErr(m);
  }
  b.disabled=false;b.textContent="Подключить";
}
$("sGo").addEventListener("click",connect);
$("sToken").addEventListener("keydown",function(ev){if(ev.key==="Enter")connect()});

/* ---------- boot ---------- */
$("printCss").textContent=PAGE_RULE+"@media print{"+PRINT_CSS+"}";
$("fStatus").innerHTML=STATUSES.map(function(s){return '<option value="'+s.id+'">'+s.g+" "+esc(s.name)+'</option>'}).join("");
renderLegend();

function startClient(){
  document.documentElement.classList.add("client");
  Array.prototype.forEach.call(document.querySelectorAll(".adm"),function(el){el.hidden=true});
  $("pm").hidden=true;
  var p=CLIENT.project;
  data={v:1,projects:[{id:p.id,name:p.name}],entries:CLIENT.entries.map(function(e){return Object.assign({project:p.id},e)})};
  activeProj=p.id;
  $("brand").textContent="Контент-план · "+p.name;$("brand").hidden=false;
  setSync("ok","Обновлено "+fmtDT(CLIENT.updated));
  $("app").hidden=false;
  render();
}
async function startAdmin(fresh){
  $("app").hidden=false;
  var cached=null;
  if(!fresh){try{cached=JSON.parse(lsGet(LS_DATA)||"null")}catch(e){}}
  if(cached&&cached.projects&&cached.projects.length){data=cached}
  else data={v:1,projects:[],entries:[]};
  activeProj=lsGet(LS_PROJ);
  render();
  setSync("ok","Загружаю…");
  try{
    await loadRemote();
    if(!project(activeProj))activeProj=data.projects[0].id;
    lsSet(LS_PROJ,activeProj);
    setSync("ok","Синхронизировано");
  }catch(e){
    if(!data.projects.length){
      $("app").hidden=true;$("setup").hidden=false;
      showSetupErr((e&&e.message)||"Не получилось загрузить данные.");
    }else handleErr(e,false);
  }
  render();
}
function boot(){
  if(CLIENT){startClient();return}
  try{cfg=JSON.parse(lsGet(LS_CFG)||"null")}catch(e){cfg=null}
  if(!cfg||!cfg.token){cfg=null;$("setup").hidden=false;return}
  startAdmin(false);
}
boot();
})();
